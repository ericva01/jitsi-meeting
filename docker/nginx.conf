server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|map|png|svg|ttf|wasm|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Meeting room names are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
